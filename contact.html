    <link href="smartphone.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">

<body>
    <div id="wrapper">
        <header>
            <h1>Contact me</h1>
            <nav>
                <a href="index.html">Home</a> |
                <a href="about.html">About me</a> |
                <a href="projects.html">Projects</a> |
                <a href="contact.html">Contact</a>
            </nav>
        </header>
        <article>
            <h2>Contact form</h2>
            <!--contact form for user information and comments-->
            <!--action tells the form where to send the information-->
            <!--method tells the form how the information is sent when submit is clicked-->
            <!--enctype tells the form how the information should be formatted-->
            <!-- name gives the form a name so it can be identified-->
            <form 
            action="mailto:oyindunmola.mojoyinola@ontariotechu"
            method="post"
            enctype="text/plain"
            name="contact_form"> 
               <p>
                <label for="name">Name:</label> <!--tells users to input name-->
                <input type="text" name="name" id="name" size="32" placeholder="enter your name" required>
                </p>
                <p>
                <label for="email">Email:</label> <!--tells user to input email-->
                <input type="email" name="email" id="email" size="32" placeholder="enter your email" required>
                </p>
                <p>
                <label for="cell">cell No. :</label> <!--tells user to input cell number-->
                <input type="tel" name="cell" id="cell" size="32" placeholder="enter your cell number" required>
                </p>
                <p>
                <label for="comments">comments:</label> <!--tells user to input comments-->
                <br>
                <textarea name="comments" id="comments" rows="6" cols="60" ></textarea> 
                <!--text area creates a box for users to enter their comments-->
                <!--the size is specified by rows and cols-->
                
                </p>
                <p> 
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset"> <!--this allows a reset of the form-->
                </p>
                
        
        
             </form>
        </article>
        <footer>
            <address>
                <p>
                contact me at
                <a href="mailto:oyindunmola.mojoyinola@ontariotechu">oyindunmola.mojoyinola@ontariotechu</a>
                </p>
            </address>
            <p>© 2026 dunmola Portfolio</p>
        </footer>
    </div>
</body>
